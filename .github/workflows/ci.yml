name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache SARIF tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-sarif-tools-v1

      - name: Install SARIF tools
        run: cargo xtask ci install-clippy-deps

      - name: Run Clippy
        run: |
          cargo clippy --all-features --all-targets --message-format=json |
            clippy-sarif | tee clippy-results.sarif | sarif-fmt
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: clippy-results.sarif
          wait-for-processing: true

  test:
    # Runs on macOS because the roundtrip + linkage tests need a real
    # GPU, and GitHub's macOS runners have a Metal device. Linux runners
    # have no GPU, so the fmt/clippy/docs jobs (which don't need one)
    # stay on ubuntu-latest. If we want non-GPU unit tests on Linux too,
    # add a separate ubuntu-latest job selecting only `cargo test -p
    # wgsl-rs --lib`.
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Roundtrip tests
        run: cargo test -p roundtrip-tests

      - name: Unit tests
        run: cargo xtask ci unit-tests

      - name: Doc tests
        run: cargo xtask ci doc-tests

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check doc generation
        run: cargo xtask ci docs 
