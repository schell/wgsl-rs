[package]
name = "wgsl-rs-layout"
version = "0.1.0-beta.1"
edition = "2024"
description = "WGSL memory layout for wgsl-rs: WgslLayout and #[derive(Layout)] so CPU structs match GPU buffer layouts."
license = "MIT"
repository = "https://github.com/schell/wgsl-rs"
readme = "../../README.md"
rust-version = "1.87"

[features]
default = []
doc-diagrams = ["dep:snafu"]

[dependencies]
wgsl-rs = { version = "0.1.0-beta.1", path = "../wgsl-rs" }
wgsl-rs-layout-macros = { version = "0.1.0-beta.1", path = "../wgsl-rs-layout-macros" }
snafu = { workspace = true, optional = true }