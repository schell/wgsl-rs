[package]
name = "wgsl-rs-macros"
version = "0.1.0-beta.2"
edition = "2024"
description = "Procedural macro support for wgsl-rs: the #[wgsl] module macro."
license = "MIT"
repository = "https://github.com/schell/wgsl-rs"
readme = "../../README.md"
rust-version = "1.87"

[features]
# The `linkage-wgpu` feature used to control compile-time wgpu linkage
# generation in the proc-macro. After issue #120, wgpu linkage is
# produced at runtime by `wgsl_rs::linkage::wgpu` (gated on the same
# feature on the `wgsl-rs` crate). This feature is now a no-op kept
# for backwards compatibility with downstream Cargo features.
default = ["validation"]
linkage-wgpu = []
validation = []

[lib]
proc-macro = true
bench = false

[dependencies]
itertools.workspace = true
proc-macro2.workspace = true
snafu.workspace = true
syn.workspace = true
quote.workspace = true
wgsl-rs-ir = { version = "0.1.0-beta.1", path = "../wgsl-rs-ir" }