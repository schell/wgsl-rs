[package]
name = "wgsl-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["validation", "dispatch-runtime"]
serde = ["dep:serde", "half/serde"]
validation = ["dep:naga", "wgsl-rs-macros/validation"]
dispatch-runtime = ["dep:rayon"]
linkage-wgpu = ["dep:wgpu", "wgsl-rs-macros/linkage-wgpu"]

[dependencies]
glam.workspace = true
half = "2"
naga = { workspace = true, optional = true }
paste = "1"
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
snafu.workspace = true
wgpu = { workspace = true, optional = true }
wgsl-rs-ir = { path = "../wgsl-rs-ir" }
# Default features are disabled so that the macros crate's `validation`
# flag is enabled solely through this crate's `validation` feature (which
# forwards `wgsl-rs-macros/validation`). The macro gates its generated
# `__validate_wgsl` test emission on the macros crate's own
# `cfg!(feature = "validation")`; with defaults on, feature unification
# kept that enabled under `--no-default-features`, emitting tests that
# reference the missing `Source::validate`.
wgsl-rs-macros = { version = "0.1.0", path = "../wgsl-rs-macros", default-features = false }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
trybuild = "1"
