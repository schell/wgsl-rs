[package]
name = "wgsl-rs"
version = "0.1.0-beta.6"
edition = "2024"
description = "Write WGSL shaders in a subset of Rust: CPU-runnable, GPU-rendered, with wgpu runtime linkage."
license = "MIT"
repository = "https://github.com/schell/wgsl-rs"
readme = "../../README.md"
rust-version = "1.87"
keywords = ["wgsl", "wgpu", "shader", "gpu"]
categories = ["graphics", "game-development"]

[features]
default = ["validation", "dispatch-runtime", "fast-compile", "extras"]
serde = ["dep:serde", "half/serde"]
validation = ["dep:naga", "wgsl-rs-macros/validation"]
dispatch-runtime = ["dep:rayon"]
# Emit IR as static `static_ir` data plus a slim conversion shim
# (wgsl-rs#221). Default-on: opt-in fixes never reach users. Opting
# out requires `default-features = false` (and re-enabling the
# wanted default features) across the *whole* build graph, because
# cargo unifies features: one crate keeping the defaults turns this on
# for everyone in that graph.
fast-compile = ["wgsl-rs-macros/fast-compile"]
# Include the `wgsl_rs::extras` module, which contains extra QoL additions.
extras = []

[dependencies]
glam.workspace = true
half = "2"
naga = { workspace = true, optional = true }
paste = "1"
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
snafu.workspace = true
wgsl-rs-ir = { version = "0.1.0-beta.6", path = "../wgsl-rs-ir" }
# Default features are disabled so that the macros crate's `validation`
# flag is enabled solely through this crate's `validation` feature (which
# forwards `wgsl-rs-macros/validation`). The macro gates its generated
# `__validate_wgsl` test emission on the macros crate's own
# `cfg!(feature = "validation")`; with defaults on, feature unification
# kept that enabled under `--no-default-features`, emitting tests that
# reference the missing `Source::validate`.
wgsl-rs-macros = { version = "0.1.0-beta.6", path = "../wgsl-rs-macros", default-features = false }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true }
trybuild = "1"

[package.metadata.docs.rs]
# Docs.rs builds with default features only, which hides the serde impls
# (behind `serde`). Document everything.
all-features = true
